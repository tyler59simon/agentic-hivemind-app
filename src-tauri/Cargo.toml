[package]
name = "agentic-hivemind"
version = "0.1.0"
description = "Hivemind: a desktop app for Agentic Living Memory"
authors = ["Tyler Simon"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "agentic_hivemind_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
encoding_rs = "0.8.44"
chardetng = "1.0.0"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify-debouncer-mini = "0.7.0"
dirs = "7.0.0"
tauri-plugin-global-shortcut = "2"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
portable-pty = "0.9"
tauri-plugin-dialog = "=2.8.4"
sysinfo = { version = "0.40", default-features = false, features = ["system"] }
sha2 = "0.10"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
rusqlite = { version = "0.43", features = ["bundled"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "=0.8.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
